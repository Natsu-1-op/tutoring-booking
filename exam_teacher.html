<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命题与评卷</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); MathJax.startup.document.outputJax.options.displayAlign = 'left'; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="teacher-body">

    <!-- 登录门禁 -->
    <div id="teacher-gate-login-mask" class="teacher-gate-mask">
        <div class="teacher-gate-card">
            <h3>阅卷工作台</h3>
            <p class="teacher-gate-hint">请输入管理员口令：</p>
            <input type="password" id="gate-pass-input" placeholder="管理员口令" class="teacher-gate-input">
            <button onclick="executeManualGateAuth()" class="teacher-gate-btn">验证登入</button>
            <p id="gate-error-lbl" class="teacher-gate-error"></p>
        </div>
    </div>

    <div class="teacher-container">
        <!-- 导航Tab -->
        <div class="teacher-tabs">
            <button class="teacher-tab active" onclick="switchPane(this, 'pane-make')">出题命卷</button>
            <button class="teacher-tab" onclick="switchPane(this, 'pane-grade')">评卷中心</button>
            <button class="teacher-tab" onclick="switchPane(this, 'pane-review')">成绩复查</button>
            <button class="teacher-tab" onclick="switchPane(this, 'pane-rank')">成绩排名</button>
        </div>

        <!-- 出题命卷 -->
        <div class="teacher-pane active" id="pane-make">
            <div class="teacher-section">
                <label class="teacher-section-label">试卷二次编辑（导入已有母卷）</label>
                <input type="file" id="reimport-master-to-edit" accept=".json">
            </div>
            <div class="teacher-form-row">
                <div class="teacher-form-group">
                    <label>考试名称</label>
                    <input type="text" id="make-title" placeholder="例：2026学年期末考试" class="teacher-input">
                </div>
                <div class="teacher-form-row-split">
                    <div class="teacher-form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" id="make-start" class="teacher-input">
                    </div>
                    <div class="teacher-form-group">
                        <label>截止时间</label>
                        <input type="datetime-local" id="make-end" class="teacher-input">
                    </div>
                </div>
            </div>
            <div id="builder-list-container"></div>
            <div class="teacher-btn-row teacher-btn-row-equal">
                <button class="teacher-btn teacher-btn-outline" onclick="addQ()">新增试题</button>
                <button class="teacher-btn" style="background:#f5f5f5;color:#999;" onclick="clearAllQuestions()">清空</button>
                <button class="teacher-btn teacher-btn-green" onclick="exportJsonPapers()">生成导出</button>
            </div>
        </div>

        <!-- 评卷中心 -->
        <div class="teacher-pane" id="pane-grade">
            <!-- AI 配置面板 -->
            <div class="ai-config-panel" id="ai-config-panel">
                <div class="ai-config-header" onclick="document.getElementById('ai-config-body').classList.toggle('hidden')">
                    <span>AI 批改设置</span><span class="ai-config-arrow">展开</span>
                </div>
                <div class="ai-config-body hidden" id="ai-config-body">
                    <div class="ai-config-row">
                        <label>API 地址</label>
                        <input type="text" id="ai-api-url" placeholder="https://api.openai.com/v1/chat/completions" class="teacher-input">
                    </div>
                    <div class="ai-config-row">
                        <label>API Key</label>
                        <input type="password" id="ai-api-key" placeholder="sk-..." class="teacher-input">
                    </div>
                    <div class="ai-config-row">
                        <label>模型名称</label>
                        <input type="text" id="ai-model" placeholder="gpt-4o / deepseek-chat" class="teacher-input">
                    </div>
                    <button class="teacher-btn teacher-btn-sm" style="background:#409eff;color:#fff;" onclick="saveAiConfig()">保存配置</button>
                    <span id="ai-config-status" class="text-gray" style="font-size:12px;margin-left:10px;"></span>
                </div>
            </div>

            <div class="import-section import-section-blue">
                <label>导入教师明文母卷 (Master)</label>
                <input type="file" id="load-master" accept=".json">
            </div>
            <div id="student-file-zone" class="import-section import-section-green" style="display:none;">
                <label>导入学生答案数据 (JSON)</label>
                <input type="file" id="load-answer" accept=".json">
            </div>

            <div id="grading-workspace-root" class="grading-workspace" style="display:none;">
                <div class="grading-left-core" id="grading-loop-container"></div>
                <div class="grading-right-panel">
                    <div class="grading-student-card">
                        <h4>考生信息</h4>
                        <div><b>姓名：</b><span id="g-name" class="text-red text-bold" style="font-size:18px;">-</span></div>
                        <div><b>耗时：</b><span id="g-duration" class="text-blue text-bold">-</span></div>
                        <div><b>交卷：</b><span id="g-submit" class="text-gray" style="font-size:12px;">-</span></div>
                    </div>
                    <label class="grading-side-label">浏览模式</label>
                    <div class="teacher-view-toggle">
                        <button class="teacher-view-btn active" id="mode-btn-full" onclick="switchViewMode('full')">整卷浏览</button>
                        <button class="teacher-view-btn" id="mode-btn-single" onclick="switchViewMode('single')">单题轮切</button>
                    </div>
                    <div id="single-navigator-zone" style="display:none; margin-bottom:12px;">
                        <button class="teacher-btn teacher-btn-gray teacher-btn-sm" onclick="navigateSingleQ(-1)">上一题</button>
                        <button class="teacher-btn teacher-btn-gray teacher-btn-sm" style="float:right;" onclick="navigateSingleQ(1)">下一题</button>
                    </div>
                    <label class="grading-side-label">题目导航</label>
                    <div class="q-navigation-grid" id="grading-grid-dots"></div>
                    <button class="teacher-btn teacher-btn-full ai-grade-all-btn" onclick="gradeAllWithAI()">AI 批改全部</button>
                    <button class="teacher-btn teacher-btn-green teacher-btn-full" style="margin-top:8px;" onclick="saveStudentScoreAndPackage()">导出评卷打分包</button>
                </div>
            </div>

            <div id="summary-zone" style="display:none; margin-top:25px;">
                <div id="table-render"></div>
                <button class="teacher-btn teacher-btn-orange teacher-btn-full" onclick="exportCSV(true)">导出本地成绩 CSV</button>
            </div>
        </div>

        <!-- 成绩复查 -->
        <div class="teacher-pane" id="pane-review">
            <div class="import-section import-section-yellow">
                <label>导入评卷打分包 (JSON)</label>
                <input type="file" id="load-review-package" accept=".json">
            </div>
            <div id="review-workspace" class="grading-workspace" style="display:none;">
                <div class="grading-left-core" id="review-loop-container"></div>
                <div class="grading-right-panel grading-review-panel">
                    <div class="grading-student-card grading-review-card">
                        <h4 style="color:#2b6914;">复查信息</h4>
                        <div><b>姓名：</b><span id="r-name" class="text-bold" style="font-size:18px;">-</span></div>
                        <div><b>耗时：</b><span id="r-duration" class="text-blue text-bold">-</span></div>
                        <div><b>交卷：</b><span id="r-submit" class="text-gray" style="font-size:12px;">-</span></div>
                        <div><b>时段：</b><span id="r-window" class="text-gray" style="font-size:11px;">-</span></div>
                        <div class="grading-review-score"><b>得分：</b><span id="r-total-score" class="text-red text-bold" style="font-size:24px;">0</span> 分</div>
                    </div>
                    <label class="grading-side-label">答题面板</label>
                    <div class="q-navigation-grid" id="review-grid-dots"></div>
                </div>
            </div>
        </div>

        <!-- 成绩排名 -->
        <div class="teacher-pane" id="pane-rank">
            <div class="teacher-rank-filter">
                <label class="text-blue text-bold">选择考卷：</label>
                <select id="rank-paper-selector" class="teacher-rank-select"></select>
            </div>
            <div class="teacher-rank-stats">
                <div>有效考生：<b id="stat-count" class="text-blue">0</b> 人</div>
                <div class="teacher-rank-avg">全班平均分：<b id="stat-average" class="text-red">0.00</b> 分</div>
            </div>
            <div class="teacher-rank-header">
                <h3>名次排行榜</h3>
                <button class="teacher-btn teacher-btn-cyan" onclick="exportCSV(false)">导出名次表 CSV</button>
            </div>
            <div id="rank-table-wrapper">
                <p class="msg-hint">暂无数据。</p>
            </div>
        </div>
    </div>

    <div id="global-lightbox" class="lightbox-overlay" onclick="closeGlobalLightbox()">
        <img id="global-lightbox-img" src="" alt="放大视图">
    </div>

    <script src="config/firebase-env.js"></script>
    <script src="exam_teacher.js"></script>
</body>
</html>
