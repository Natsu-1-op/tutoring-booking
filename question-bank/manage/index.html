<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<title>华科 839 · 内部链接管理</title>
<style>
:root{color:#17243a;background:#f8fafc;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px}header>div,main{max-width:920px;margin:auto}header>div{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 11px}main{padding:20px 15px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:14px}[hidden]{display:none!important}label{display:grid;gap:4px;color:#475569;font-size:14px}form{display:flex;align-items:end;gap:10px;flex-wrap:wrap}input,button{font:inherit;padding:7px 10px;border:1px solid #d7e2f0;border-radius:7px;background:#fff;color:inherit}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2563eb;outline-offset:2px}button{cursor:pointer;color:#1d4ed8;background:#eff6ff}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button.danger{color:#a13423;background:#fff1ec;border-color:#fee0d6}button:disabled{opacity:.52;cursor:default}.muted{font-size:13px;color:#526780}a{color:#1d4ed8}.short{width:104px}#generated{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}#generated input{flex:1;min-width:190px}.area{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px;text-align:left}th,td{border-bottom:1px solid #e2e8f0;padding:8px 7px;font-size:14px}th{color:#475569}td button{padding:3px 7px;margin:2px}p[role=status]{margin:8px 0}.live{color:#17614c}.off{color:#885040}
textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #d7e2f0;border-radius:7px;resize:vertical;background:#fff;color:inherit}
#gen-result{margin:10px 0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
#gen-result[hidden]{display:none}
#gen-result textarea{flex:1;min-width:220px}
</style>
</head>
<body>
<header><div><h1>内部链接管理</h1><a href="../">返回题库</a><button type="button" id="exit" hidden>退出</button></div></header>
<main>
<section class="card" id="login">
<h2>题库管理员</h2>
<form id="sign-in"><label>个人口令<input type="password" id="password" autocomplete="current-password" maxlength="128" required></label><button class="primary" type="submit">登录管理</button></form>
</section>
<div id="manage" hidden>
<section class="card">
<h2>生成内部链接</h2>
<form id="create"><label>备注<input id="label" placeholder="例如：考前练习" maxlength="60"></label><label>有效期（小时）<input class="short" id="hours" type="number" min="1" max="720" step="1" value="24" required></label><button class="primary" type="submit">生成链接</button></form>
<p class="muted">有效期从生成时起计算。拿到完整链接即可在到期前打开题库。</p>
<div id="generated" hidden><input id="share" aria-label="刚生成的内部链接" readonly><button type="button" id="copy-current">复制链接</button></div>
</section>
<section class="card">
<h2>已生成的链接</h2>
<div class="area"><table><thead><tr><th>备注</th><th>到期时间（北京时间）</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<section class="card">
<h2>题库激活码</h2>
<form id="gen-codes"><label>数量<input class="short" id="gen-count" type="number" min="1" max="50" step="1" value="5" required></label><label>有效天数<input class="short" id="gen-days" type="number" min="1" max="1095" step="1" value="365" required></label><label>备注<input id="gen-note" maxlength="60" placeholder="例如：2027 届第一批"></label><button class="primary" type="submit">批量生成</button></form>
<p class="muted">激活码只用于题库账号（邮箱登录），与 1v1 约课名单互相独立。每个码只能兑换一次，续期按叠加天数计算。</p>
<div id="gen-result" hidden><textarea id="gen-output" rows="4" readonly aria-label="本次生成的激活码"></textarea><button type="button" id="gen-copy">复制本次</button></div>
<div class="area"><table><thead><tr><th>激活码</th><th>备注</th><th>天数</th><th>状态</th><th>使用者</th><th>到期时间</th></tr></thead><tbody id="code-rows"></tbody></table></div>
<button type="button" id="copy-unused">复制全部未使用激活码</button>
</section>
<section class="card">
<h2>题库用户</h2>
<form id="renew-form"><label>续期天数<input class="short" id="renew-days" type="number" min="1" max="1095" step="1" value="365" required></label><button type="button" id="refresh">刷新列表</button></form>
<p class="muted">只统计题库账号；未激活账号不占用 1v1 约课名单。停用后该账号立即无法解锁题库，但不会删除其答题记录以外的任何数据。</p>
<div class="area"><table><thead><tr><th>邮箱</th><th>到期时间（北京时间）</th><th>状态</th><th>操作</th></tr></thead><tbody id="user-rows"></tbody></table></div>
</section>
</div>
<p id="status" class="muted" role="status"></p>
</main>
<script type="application/json" id="admin-config">{"apiKey": "AIzaSyB6EbZElw7ahDN5rOK-keWlgr9JInVbnN4", "database": "https://class-optic-default-rtdb.asia-southeast1.firebasedatabase.app", "ownerEmail": "1843499931@qq.com"}</script>
<script src="manage.js?v=20261123-account-1"></script>
</body>
</html>
