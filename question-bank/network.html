<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>题库网络检测</title>
<style>
body{font:16px/1.65 system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#172033}
h1{font-size:1.45rem} li{margin:.45rem 0} button{font:inherit;padding:.35rem .8rem} a{color:#1d4ed8}
</style>
</head>
<body>
<h1>题库网络检测</h1>
<p>用出现问题的设备和网络打开本页。检测无需登录，也不会发送任何个人通行证或口令。</p>
<button id="check" type="button">开始检测</button>
<ul id="results" aria-live="polite"></ul>
<p>若本页提示授权数据库超时，请稍后切换网络重试；若本页本身打不开，请检查站点访问网络。</p>
<p><a href="./">返回题库</a></p>
<script>
"use strict";
const checks = [
    ["网站静态文件", "./boot.js", false],
    ["授权数据库（Realtime Database）", "https://class-optic-default-rtdb.asia-southeast1.firebasedatabase.app/system/activeYear.json", false]
];
const button = document.getElementById("check");
const results = document.getElementById("results");
button.onclick = async () => {
    button.disabled = true;
    results.replaceChildren();
    try {
        await Promise.all(checks.map(async ([label, url]) => {
            const row = document.createElement("li");
            row.textContent = label + "：检测中";
            results.append(row);
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);
            try {
                const response = await fetch(url, {
                    mode: "cors",
                    cache:"no-store", credentials:"omit", signal:controller.signal
                });
                const status = response.ok ? "读取成功" : "收到响应，HTTP " + response.status;
                row.textContent = label + "：" + status;
            } catch (error) {
                row.textContent = label + "：" + (error.name === "AbortError" ? "8 秒未响应" : "连接失败或响应被浏览器拦截");
            } finally { clearTimeout(timer); }
        }));
    } finally { button.disabled = false; }
};
button.click();
</script>
</body>
</html>
