<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约系统后台</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #admin-login {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f5f7fa; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        #admin-content { display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #eee; padding-bottom: 14px; margin-bottom: 20px; }
        .admin-header h2 { margin: 0; border: none; padding: 0; }

        /* 快捷入口 */
        .admin-toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .tool-btn { text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; }
        .tool-btn:hover { filter: brightness(0.94); }
        .tool-exam { background: #8e44ad; }
        .tool-student { background: #2980b9; }
        .tool-money { background: #27ae60; }

        /* 分块卡片 */
        .admin-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
        .admin-card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 600; font-size: 14px; color: #475569; }
        .admin-card-h .hint { font-size: 12px; color: #94a3b8; font-weight: 400; }
        .admin-card-b { padding: 14px 16px; }
        .admin-card-b > .control-panel:last-child { margin-bottom: 0; }
        .control-panel { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        .control-panel input[type="text"], .control-panel input[type="datetime-local"], .control-panel input[type="date"] { flex: 1; min-width: 160px; }
        .admin-mini-btn { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 6px; font-weight: 600; }
        .admin-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        /* 排班 */
        .template-panel { background: #f0f9eb; border: 1px solid #c2e7b0; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; }
        .template-panel h4 { margin: 0 0 8px 0; color: #67c23a; font-size: 13px; }
        .template-slots-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 8px 0 12px 0; }
        .template-slots-grid input { padding: 6px 8px; border: 1px solid #c2e7b0; border-radius: 4px; text-align: center; font-size: 13px; }

        /* 白名单 */
        .student-tag { display: inline-flex; align-items: center; background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; padding: 4px 10px; border-radius: 4px; margin-right: 8px; margin-bottom: 8px; font-size: 13px; }
        .student-tag-del { margin-left: 6px; color: #ff4d4f; cursor: pointer; font-weight: bold; }
        .student-tag-del:hover { color: #f5222d; }
        .whitelist-box { margin-top: 10px; background: #fff; padding: 12px; border-radius: 8px; min-height: 40px; border: 1px solid #e4e7ed; }

        /* 数据管理 */
        .data-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .data-btn-row button { width: auto; font-size: 13px; padding: 8px 14px; border-radius: 8px; font-weight: 600; color: #fff; border: none; cursor: pointer; }
        .data-btn-row .danger { color: #fff; }
        #stats-panel { display: none; background: #fff; border: 1px solid #e4e7ed; border-radius: 8px; padding: 14px; margin-bottom: 14px; }

        /* 预约记录区域 */
        #batch-action-bar { display: none; position: sticky; bottom: 0; background: #fff; border-top: 2px solid #409eff; padding: 10px 14px; margin-top: 10px; z-index: 50; gap: 10px; align-items: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); }
        #batch-action-bar.show { display: flex; }
        .res-group { border-color: #ffd591; }
        .res-header { background: #fff7e6; color: #d46b08; border-bottom-color: #ffd591; }

        /* 日志 */
        .date-group { margin-bottom: 15px; border: 1px solid #dcdfe6; border-radius: 8px; overflow: hidden; background: #fff; }
        .date-header { background: #f5f7fa; padding: 10px 16px; font-weight: bold; color: #409eff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e4e7ed; user-select: none; font-size: 14px; }
        .date-header:hover { background: #edf5ff; }
        .date-body { padding: 10px 14px; display: block; }
        .date-body.collapsed { display: none; }
        .logs-box { background: #1e1e1e; color: #7ec699; font-family: monospace; padding: 14px; border-radius: 6px; max-height: 300px; overflow-y: auto; font-size: 12px; line-height: 1.6; border: 1px solid #333; }

        .year-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .year-select-dropdown { padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 4px; border: 1px solid #b3d8ff; background: #ecf5ff; color: #409eff; cursor: pointer; }
        #year-status-bar { margin: 10px 0 0 0; font-size: 13px; color: #666; background: #fff; padding: 8px 10px; border-radius: 4px; border: 1px solid #e4e7ed; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: vertical; font-family: inherit; }
        table { width: 100%; border-collapse: collapse; }
    </style>
</head>
<body>
    <div id="admin-login">
        <div class="container" style="max-width: 400px; text-align: center;">
            <h1>系统后台认证</h1>
            <div class="form-group" style="margin-top: 20px;">
                <input type="password" id="admin-password" placeholder="请输入管理员密码" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>
            <button id="admin-login-submit">登录</button>
            <p id="login-error" style="color: red; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <div id="admin-content" class="container" style="max-width: 1000px;">
        <div class="admin-header">
            <h2>专业课辅导 · 管理后台</h2>
            <div class="admin-toolbar">
                <a class="tool-btn tool-exam" href="exam_teacher.html" target="_blank">出卷评卷</a>
                <a class="tool-btn tool-student" href="exam_student.html" target="_blank">模拟考试</a>
                <a class="tool-btn tool-money" href="money.html" target="_blank">课时费管家</a>
            </div>
        </div>

        <div id="migration-wizard-panel" style="display: none; background: #fffbe6; border: 1px dashed #e6a23c; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px;">
            <h4 style="margin: 0 0 6px 0; color: #d46b08;">旧版数据迁移</h4>
            <p style="font-size: 12px; margin: 0 0 8px 0; color: #777;">检测到旧版扁平排班数据，执行一次性迁移以适配多学年架构。</p>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <button id="mgr-start-btn" style="background: #e6a23c; width: auto; font-size: 12px; padding: 6px 12px;">启动迁移</button>
                <button id="purge-old-btn" disabled style="background: #909399; width: auto; font-size: 12px; padding: 6px 12px;">等待校验</button>
            </div>
            <p id="migration-log" style="margin: 6px 0 0 0; font-size: 12px; font-weight: bold; color: #666;"></p>
        </div>

        <!-- 学年管理 -->
        <div class="admin-card">
            <div class="admin-card-h"><span>学年管理</span><span class="hint">切换查看的学年，所有数据按学年隔离</span></div>
            <div class="admin-card-b">
                <div class="year-row">
                    <select id="admin-year-select" class="year-select-dropdown"></select>
                    <button id="btn-set-active" class="teacher-btn teacher-btn-sm admin-mini-btn" style="background:var(--c-primary);">设为当前</button>
                    <button id="btn-create-year" class="teacher-btn teacher-btn-sm admin-mini-btn" style="background:var(--c-success);">新增</button>
                    <button id="btn-destroy-year" class="teacher-btn teacher-btn-sm admin-mini-btn" style="background:var(--c-danger);">删除</button>
                </div>
                <p id="year-status-bar"></p>
            </div>
        </div>

        <!-- 排班管理 -->
        <div class="admin-card">
            <div class="admin-card-h"><span>排班管理</span></div>
            <div class="admin-card-b">
                <div class="template-panel">
                    <h4>批量生成</h4>
                    <div class="control-panel" style="margin-bottom: 6px;">
                        <label style="font-size: 13px; color: #4f8234; margin: 0; font-weight: 600;">日期：</label>
                        <input type="date" id="template-date" style="width: auto; padding: 8px; flex: 0 1 auto;">
                    </div>
                    <div class="template-slots-grid">
                        <input type="text" id="tpl-time-1" value="0800-1015">
                        <input type="text" id="tpl-time-2" value="1030-1245">
                        <input type="text" id="tpl-time-3" value="1330-1545">
                        <input type="text" id="tpl-time-4" value="1600-1815">
                        <input type="text" id="tpl-time-5" value="1900-2115">
                    </div>
                    <div class="admin-btn-row">
                        <button id="btn-gen-tpl" style="background:#67c23a; flex:1; font-size:13px; padding:9px;">确认生成</button>
                        <button id="btn-save-tpl" style="background:#409eff; width:auto; font-size:12px; padding:9px 12px;">存为模板</button>
                    </div>
                </div>
                <div class="control-panel">
                    <input type="text" id="new-slot-time" placeholder="手动新增，例：6/19 1400-1500">
                    <button id="btn-add-slot" class="admin-mini-btn" style="white-space: nowrap;">新增</button>
                </div>
                <div id="admin-slots-container">读取中...</div>
            </div>
        </div>

        <!-- 公告与准入 -->
        <div class="admin-card">
            <div class="admin-card-h"><span>公告与准入名单</span></div>
            <div class="admin-card-b">
                <div class="form-group">
                    <textarea id="notice-input" rows="3" placeholder="输入公告内容，留空则不显示。"></textarea>
                    <div style="margin: 8px 0; background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
                        <label style="font-size: 13px; color: #666; margin-bottom: 5px;">附加图片：</label>
                        <div id="notice-img-preview-container" style="display: none; margin-bottom: 8px;">
                            <img id="notice-img-preview" src="" style="max-width: 220px; display: block; margin-bottom: 8px; border-radius: 6px; border: 1px solid #eee;">
                            <button id="btn-del-notice-img" class="danger" style="width: auto; font-size: 12px; padding: 4px 8px;">移除图片</button>
                        </div>
                        <input type="file" id="notice-image-input" accept="image/*" style="font-size: 12px;">
                    </div>
                    <button id="btn-set-notice" style="background:#e6a23c; margin-top: 6px; width: auto; font-size: 13px; padding: 8px 16px;">保存公告</button>
                </div>
                <div style="border-top: 1px dashed #e2e8f0; padding-top: 12px; margin-top: 4px;">
                    <div class="control-panel" style="margin-bottom: 8px;">
                        <input type="text" id="new-student-name" placeholder="请输入准入同学姓名">
                        <button id="btn-add-student" class="admin-mini-btn" style="white-space: nowrap; background: #409eff; color: #fff;">添加</button>
                    </div>
                    <div class="whitelist-box" id="admin-student-whitelist-container">正在调取名单...</div>
                </div>
            </div>
        </div>

        <!-- 全局设置 -->
        <div class="admin-card">
            <div class="admin-card-h"><span>全局设置</span></div>
            <div class="admin-card-b">
                <div class="control-panel">
                    <input type="datetime-local" id="deadline-input">
                    <button id="btn-set-deadline" class="admin-mini-btn">保存截止时间</button>
                </div>
                <div class="control-panel">
                    <input type="text" id="code-input" placeholder="输入新的预约口令">
                    <button id="btn-set-code" class="admin-mini-btn">保存口令</button>
                </div>
            </div>
        </div>

        <!-- 预约记录 -->
        <h2 style="font-size:15px; margin-top: 24px;">预约记录</h2>
        <div id="batch-action-bar" class="batch-action-bar">
            <span class="text-bold" style="font-size:13px;">已选 <b id="batch-count" class="text-red">0</b> 条</span>
            <select id="batch-target-status" style="padding:6px 10px; border-radius:4px; font-weight:bold; font-size:13px;">
                <option value="">-- 改为 --</option>
                <option value="booked">已预约</option><option value="confirmed">已确认</option>
                <option value="completed">已完成</option><option value="canceled">已取消</option>
            </select>
            <button id="btn-batch-apply" class="admin-mini-btn" style="background:#409eff; color:#fff;">应用</button>
        </div>
        <div id="admin-reservations-container">读取中...</div>

        <!-- 数据管理 -->
        <div class="admin-card">
            <div class="admin-card-h"><span>数据管理</span></div>
            <div class="admin-card-b">
                <div class="data-btn-row">
                    <button id="btn-export-csv" style="background:#52c41a;">导出当年 CSV</button>
                    <button id="btn-export-tutor-json" style="background:#2563eb;">导出课时费 JSON</button>
                    <button id="btn-show-stats" style="background:#e6a23c;">课时统计</button>
                    <button id="btn-export-all" style="background:#7c3aed;">全量备份</button>
                    <button id="btn-restore-all" style="background:#f59e0b;">还原备份</button>
                    <button id="btn-clear-year" class="danger" style="background:#ef4444;">清空本年数据</button>
                </div>
                <input type="file" id="restore-file-input" accept=".json" style="display:none;">
                <div id="stats-panel"></div>
            </div>
        </div>

        <!-- 系统日志 -->
        <div class="date-group" style="margin-top: 24px; border-color: #909399;">
            <div class="date-header" id="btn-toggle-logs" style="background: #f4f4f5; color: #606266; border-bottom-color: #dcdfe6; cursor: pointer;">
                <span>系统操作日志</span>
                <span class="arrow-indicator" id="log-arrow-indicator">展开 +</span>
            </div>
            <div class="date-body collapsed" id="admin-logs-wrapper" style="background: #fff;">
                <div style="text-align:right; margin-bottom:8px;">
                    <button class="danger" id="btn-clear-logs" style="width:auto; padding:4px 10px; font-size:12px;">清空日志</button>
                </div>
                <div class="logs-box" id="admin-logs-container">加载中...</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="config/firebase-env.js"></script>
    <script src="utils/time-parser.js"></script>
    <script src="admin.js"></script>
</body>
</html>
